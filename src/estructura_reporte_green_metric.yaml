Métricas:
- 1 Proporción de área de vegetación con respecto al área total del campus
- 2 Proporción de área verde pública en relación con la población total del campus
- 3 Porcentage de la superficie del campo cubierta por bosque o vegetación densa
- 4 Porcentage de área dedicada a la absorción de agua de lluvia
- 5 Presupuesto de la universidad destinado a proyectos y actividades de sostenibilidad
- 6 Operación y mantenimiento del campos enfocados en la conservación ambiental


Datos:
- Área total del campo
- Área verde
- Población total del campus
- Área dedicada a la absorción de agua de lluvia
- Presupuesto de la universidad destinado a proyectos y actividades de sostenibilidad
- Operación y mantenimiento del campos enfocados en la conservación ambiental

Las métricas se calculan utilizando los datos proporcionados anteriormente.
y se evaluarán trimestralmente para asegurar el cumplimiento de los objetivos de sostenibilidad del campus.